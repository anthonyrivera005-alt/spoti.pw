name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Build Dependencies
        run: |
          brew install ldid bsdmake python@3.11
          pip3 install --break-system-packages pyzule || true

      - name: Prepare Spotify IPA
        run: |
          mkdir -p ipa
          curl -fSSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa

      - name: Inject Tweak Package
        run: |
          mkdir -p out
          cp ipa/spotify.ipa out/spoti.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error
