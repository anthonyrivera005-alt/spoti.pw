name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Pyzule
        run: |
          brew install bsdmake
          git clone https://github.com/asdfzxcvbn/pyzule.git
          cd pyzule && sudo ./install.sh

      - name: Prepare Spotify IPA
        run: |
          mkdir -p ipa
          curl -fSSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa

      - name: Fetch and Inject EeveeSpotify
        run: |
          curl -Lo eevee.deb https://github.com/SideloadLabs/EeveeSpotifyReincarnated/releases/latest/download/EeveeSpotify.deb
          pyzule -i ipa/spotify.ipa -o ipa/spotify.ipa -f eevee.deb

      - run: make release THEOS=$HOME/theos

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> $GITHUB_STEP_SUMMARY
          for f in out/*.ipa; do
            curl -fSs -X POST -H "Content-Type: application/octet-stream" --data-binary @"$f" "https://filebin.net/$BIN/$(basename "$f")"
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> $GITHUB_STEP_SUMMARY
          done
          echo "- _filebin deletes bins after 6 days_" >> $GITHUB_STEP_SUMMARY
