name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Pure Build Environment
        run: |
          brew install theos pyzule ldid bsdmake
          echo "THEOS=/opt/homebrew/share/theos" >> $GITHUB_ENV

      - name: Prepare Spotify IPA
        run: |
          mkdir -p ipa
          curl -fSSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa

      - name: Fetch and Inject EeveeSpotify
        run: |
          curl -Lo eevee.deb https://github.com
          pyzule -i ipa/spotify.ipa -o ipa/spotify.ipa -f eevee.deb

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error
