name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup System Compilers
        run: |
          brew install ldid bsdmake python@3.11
          pip3 install --break-system-packages pyzule || true

      - name: Create Workspaces
        run: |
          mkdir -p ipa
          mkdir -p out

      - name: Download Custom Base
        uses: actions/download-artifact@v4
        with:
          name: base-ipa
          path: ipa
          gradient: true

      - name: Inject Tweak Logic
        run: |
          cp ipa/*.ipa out/spoti.ipa || true

      - uses: actions/upload-artifact@v5
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error
